name: api

on:
  push:
    branches: [main, v1-rebuild]
    paths: ["apps/api/**", "packages/api-contract/**", "packages/test-fixtures/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", "packages/api-contract/**", "packages/test-fixtures/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Skip until the uv project exists (Plan 1 · Task 1)
        id: guard
        run: echo "ready=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.guard.outputs.ready == 'true'
      - if: steps.guard.outputs.ready == 'true'
        run: uv sync --locked || uv sync
      - name: Lint
        if: steps.guard.outputs.ready == 'true'
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Tests
        if: steps.guard.outputs.ready == 'true'
        run: uv run pytest -q
      - name: OpenAPI contract is up to date
        if: steps.guard.outputs.ready == 'true' && hashFiles('apps/api/scripts/export_openapi.py') != ''
        run: |
          uv run python scripts/export_openapi.py > /tmp/openapi.json
          diff -u ../../packages/api-contract/openapi.json /tmp/openapi.json \
            || (echo "::error::openapi.json is stale — run 'just contract' and commit" && exit 1)
