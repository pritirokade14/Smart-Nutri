# Install: `uv tool install pre-commit && pre-commit install` (or `just setup`).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^apps/app/
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        files: ^apps/api/
        args: [--fix]
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.4
    hooks:
      - id: biome-check
        files: ^(apps/web|packages)/.*\.(ts|tsx|js|jsx|json|css)$
        exclude: ^packages/api-contract/

  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: ^apps/app/.*\.dart$
        exclude: \.(g|freezed)\.dart$
