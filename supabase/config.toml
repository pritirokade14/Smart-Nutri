# Supabase CLI config for local development (`supabase start`).
# Hand-written (the CLI was not installed when this was added); the CLI fills in
# defaults for every omitted setting.
#
# Auth, storage and redirect settings only. Tables and RLS policies live ONLY in
# apps/api/alembic (ADR 0009); never add them here.

project_id = "smartnutri"

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "com.smartnutri.app://login-callback",
]

[auth.email]
enable_signup = true

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Private label-photo bucket for local `supabase start` (no policies: only the API's
# service key and signed URLs reach it). Dev and prod buckets are created in the dashboard
# (see docs/SETUP_ACCOUNTS.md).
[storage.buckets.label-photos]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# Private bucket for spoken voice answers (voice/{account_id}/{uuid}.mp3), written by the API
# and read through 1-hour signed URLs. Objects are deleted after 24 h (Plan 8 retention job).
[storage.buckets.voice-answers]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["audio/mpeg"]
