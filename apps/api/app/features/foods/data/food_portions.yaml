# PENDING DIETITIAN REVIEW. Read by app/features/foods only (the seed job and its tests).
#
# Per-food household grams and densities, each from a row of
# docs/research/food-diary/data/household_units.csv (`csv_key`). tests/unit/foods/test_seed_data.py
# checks that every number equals its CSV cell and that no empty CSV cell gets a number.
#
# The CSV unit_key is mapped to a unit code (ADR 0024): size words (large, medium, small) map to
# piece_large, piece_medium and piece_small; a single fruit with no size (mango, guava) and one
# almond map to `piece`; bread slices to `slice`; packaged roti to `roti`.

portions:
