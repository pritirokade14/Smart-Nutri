# FDC portions whose food is not in the 141-row ingredient set.
not_seeded:
  - {csv_key: naan_plain_commercial, reason: "FDC 171845 is not in usda_fdc_foods.csv"}
  - {csv_key: naan_wholewheat_commercial, reason: "FDC 174077 is not in usda_fdc_foods.csv"}

# The CSV has no grams for these pieces (never invented). They produce no portion row, so the
# unit does not resolve for the food: the picker never offers it, and the user may set their own
# value (a per-food override). Each note is the CSV note, shortened.
unknown_piece_weights:
  - {csv_key: phulka, note: "Annexure 8 of NIN Dietary Guidelines 2011 gives energy only (80 kcal per phulka), no grams"}
  - {csv_key: roti_homemade_medium, note: "Only blog values (about 25 to 40 g) found, which disagree; not used"}
  - {csv_key: paratha, note: "NIN 2011 Annexure 8 gives 150 kcal per paratha, no grams"}
  - {csv_key: idli, note: "Blogs give about 30 to 50 g (about 39 to 40 g most repeated) but no validated source; not used"}
  - {csv_key: dosa_plain, note: "Blogs give about 80 to 125 g; no validated source; not used"}
  - {csv_key: vada, note: "No published weight found"}
  - {csv_key: puri, note: "No published weight found"}
  - {csv_key: samosa, note: "No published weight found"}
  - {csv_key: laddoo, note: "No published weight found; varies by type (besan, motichoor, rava)"}
  - {csv_key: papad, note: "USDA lists Papad (168106) per 100 g but gives no piece weight"}
  - {csv_key: pakora_one, note: "No published weight found"}
  - {csv_key: upma_poha_cup, note: "NIN 2011 Annexure 8 gives 270 kcal per cup; cup volume and grams not defined there"}
