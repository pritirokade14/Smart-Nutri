# PENDING DIETITIAN REVIEW. Read by app/features/foods only (the seed job and its tests).
#
# The 30 dishes of docs/research/food-diary/data/indian_dishes_recipes.md, every one
# `[assumed - needs dietitian]`. Ingredient ids are fdc_id values from usda_fdc_foods.csv; grams are
# the raw weight, as the doc gives them. Water is never an ingredient: it is already inside the
# cooked weight. Where the doc offers an alternative ("oil 5 g (or ghee 5 g)"), the first-named
# ingredient is used. tests/unit/foods/test_dishes.py checks every pair against the doc.
#
# `status` records why a dish is or is not seeded; the seed derives it from the data:
#   seeded         every ingredient is an FDC row and `cooked_weight_g` is given.
#   blocked        a core ingredient has no FDC row (fdc_id null, gap: true).
#   needs_weighing the doc gives a yield only as a count of pieces. It switches on by itself once a
#                  dietitian adds `cooked_weight_g`.
# Nutrients are never typed here: the seed sums them from the ingredients (recipe_math).

