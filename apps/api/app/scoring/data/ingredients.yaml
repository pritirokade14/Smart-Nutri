# PENDING DIETITIAN/CLINICIAN REVIEW — term lists
added_sugars:     [sugar, cane sugar, brown sugar, jaggery, gur, khand, mishri, honey, चीनी, गुड़, शहद, मध, साखर, गूळ, शक्कर, खांड, मिश्री, बूरा, khandsari, misri, agave, coconut sugar, palm sugar, rice syrup, apple juice concentrate, fruit juice concentrate, juice concentrate]
# Infant-only: free sugars from juice (Ruling R37). Whole-fruit puree is not listed.
infant_free_sugars: [juice, fruit juice, apple juice, orange juice, grape juice, mango juice, fruit puree concentrate, fruit concentrate]
hidden_sugars:    [maltodextrin, dextrose, glucose, glucose syrup, liquid glucose, invert sugar, invert syrup, fructose, high fructose corn syrup, corn syrup, sucrose, malt extract, maltose, date syrup, fruit juice concentrate, golden syrup, molasses]
sodium_additives: [monosodium glutamate, ins621, sodium benzoate, ins211, sodium bicarbonate, baking soda, ins500, sodium nitrite, ins250, disodium inosinate, ins631, disodium guanylate, ins627, ins635, sodium citrate, ins331, sodium phosphate, ins339]
caffeine:         [caffeine, coffee, guarana, tea, chai, green tea, green tea extract, kola, kola nut, matcha, mate, चाय, कॉफी]
salt:             [salt, iodised salt, rock salt, black salt, sendha namak, नमक, sodium chloride, namak, मीठ, lavan, सैंधव]
# Member-chosen ingredient alerts (Plan 5 T1; Rulings P4, P7). PENDING DIETITIAN/CLINICIAN REVIEW.
# Each match adds a CAUTION `custom_alert` reason; these are preferences, not safety rules.
# With no readable ingredient list, or extraction confidence below min_extraction_confidence,
# every enabled alert that did not match is reported once as UNKNOWN `custom_alert_unknown` (P7).
# Keys must equal app.scoring.models.CUSTOM_ALERT_KEYS minus `added_sugar`, which reuses
# added_sugars + hidden_sugars above. `exclude` phrases are blanked before matching.
# Terms are normalised like label text (lowercase; hyphens and punctuation become spaces), so
# "Ace-K" matches `ace k` and "Monosodium L-glutamate" matches `monosodium l glutamate`.
# find_terms splits "edible vegetable oil (palm)" at the bracket, so bare "palm" (and "पाम")
# is needed; palm sugar/jaggery/candy and palmyra (a sugar source, not an oil) and palm
# hearts (a vegetable) are excluded.
# KNOWN LIMITATION (P7, accepted): "Wheat flour (refined)" does not raise `maida`. The bracket
# splits "wheat flour" from "refined", and a bare `refined` term would also flag "refined oil"
# and "refined sugar". Revisit when the matcher understands bracketed qualifiers.
# artificial_sweetener also fires, with an empty ingredient list, when the product's
# `contains_sweeteners` flag is set (Open Food Facts additive tags; see off_mapping.py).
custom_alerts:
  palm_oil:
    terms:   [palm oil, palmolein, palm olein, palm kernel oil, vegetable oil (palm), edible vegetable oil (palm), palm, palm fat, पाम, पाम तेल, पाम ऑयल, पामोलिन]
    exclude: [palm sugar, palm jaggery, palm candy, palmyra, पाम शुगर, पाम गुड़, palm heart, palm hearts, hearts of palm, heart of palm]
  maida:
    terms:   [maida, refined wheat flour, refined flour, मैदा, all purpose flour, white flour, मैद्याचे पीठ]
    exclude: []
  artificial_sweetener:
    # `artificial sweetener` also catches the FSSAI declaration "Contains artificial sweetener".
    terms:   [aspartame, ins951, sucralose, ins955, acesulfame potassium, acesulfame k, ins950, saccharin, ins954, neotame, ins961, artificial sweetener, artificial sweetening agent, non nutritive sweetener, ace k, acesulfame, एस्पार्टेम, सुक्रालोज, सैकरीन, सैक्रीन, एसेसल्फेम, कृत्रिम स्वीटनर, कृत्रिम मिठास, कृत्रिम गोडवा]
    exclude: []
  msg:
    terms:   [monosodium glutamate, ins621, msg, ajinomoto, aji no moto, अजीनोमोटो, अजिनोमोटो, monosodium l glutamate, मोनोसोडियम ग्लूटामेट]
    exclude: []
