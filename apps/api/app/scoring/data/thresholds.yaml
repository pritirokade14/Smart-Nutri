# PENDING CLINICIAN REVIEW — defaults from UK FSA (high-in), FSSAI Advertising & Claims Regs 2018 (claims), NHS (child sugar)
min_extraction_confidence: 0.7
allergen_may_contain_status: avoid
high_in:
  food:  {sugars_g: 22.5, fat_g: 17.5, sat_fat_g: 5.0, salt_g: 1.5}
  drink: {sugars_g: 11.25, fat_g: 8.75, sat_fat_g: 2.5, salt_g: 0.75}
claims:   # verify values against FSSAI (Advertising & Claims) Regulations 2018, Schedule I
  sugar_free_max_g: 0.5
  low_sugar_max_g: {food: 5.0, drink: 2.5}
  low_fat_max_g: {food: 3.0, drink: 1.5}
  low_sodium_max_mg: 120
  source_of_protein_min_energy_pct: 10
  high_protein_min_energy_pct: 20
  # "No refined sugar" is contradicted by any of these ingredients (Ruling R28; pending clinician review)
  refined_sugar_terms: [sugar, cane sugar, refined sugar, sucrose, brown sugar, icing sugar]
  # Unrefined sugars are not "refined sugar": excluded before matching (Ruling R33; pending clinician review)
  unrefined_sugar_excludes: [coconut sugar, palm sugar, date sugar, jaggery, gur, khandsari, गुड़]
# Member-entered condition/goal names -> canonical applies_to names (Ruling R24; pending clinician review).
# Keys are normalised (lowercase, non-word runs -> "_"). Anything unrecognised -> condition_unrecognised (UNKNOWN).
condition_aliases:
  type_2_diabetes: diabetes
  type_1_diabetes: diabetes
  t2dm: diabetes
  t1dm: diabetes
  diabetic: diabetes
  sugar: diabetes
  gestational_diabetes: diabetes
  pre_diabetes: prediabetes
  prediabetic: prediabetes
  borderline_diabetes: prediabetes
  pcod: pcos
  high_bp: hypertension
  high_blood_pressure: hypertension
  bp: hypertension
  blood_pressure: hypertension
  lose_weight: weight_loss
  obesity: weight_loss
  overweight: weight_loss
conditions:
  blood_sugar:   # diabetes, prediabetes, pcos
    applies_to: [diabetes, prediabetes, pcos]
    # food = UK FSA high-in / FSSAI low-sugar bands (Ruling R26; pending clinician review)
    # drink avoid basis: UK Soft Drinks Industry Levy 5 g/100 ml; pending clinician review (Ruling R31)
    avoid_sugars_g: {food: 22.5, drink: 5.0}
    caution_sugars_g: {food: 5.0, drink: 2.5}
    caution_carbs_per_serving_g: 30
    # high_in keys that add a CAUTION (cardio_risk_high_in) for this group (Ruling R12;
    # PENDING CLINICIAN REVIEW). Rationale: guidance for people with diabetes also limits
    # sodium and saturated fat (ADA Standards of Care, Section 5; ICMR-NIN Dietary Guidelines 2024).
    # Uses the global high_in limits above; salt is dropped when hypertension already reported it.
    cardio_high_in: [salt, sat_fat]
  hypertension:
    applies_to: [hypertension]
    avoid_salt_g: 1.5
    caution_salt_g: 0.3
  weight_loss:
    applies_to: [weight_loss]
    caution_energy_kcal: 400
    caution_nutriscore: [D, E]
    good_protein_g_per_100kcal: 5
  child:          # infant.max_age <= age < max_age
    max_age: 13
    free_sugar_daily_limit_g: {2: 19, 7: 24, 11: 30}   # key = min age of band (NHS; 2–3 uses 4–6 value)
    caution_pct_of_limit: 25
    avoid_pct_of_limit: 50
  infant:         # age < 2
    max_age: 2
    # per 100 g / 100 ml; above -> AVOID (Ruling R27; pending clinician review —
    # 5 g lets plain milk (~4.7 g lactose) pass; infant formula (~7 g) would be flagged)
    avoid_sugars_g: 5.0
    avoid_salt_g: 0.3
# Daily limits for the meal-log summaries (Plan 6 T1). PENDING CLINICIAN REVIEW.
# Read only by daily_limits.py, never by the verdict rules. Per DAY; a week is limit x 7.
# Summaries compare TOTAL sugars from labels with these free/added-sugar limits: labels do not
# separate free from natural sugar, so the comparison over-warns (never under-warns).
daily_limits:
  # sugar 25 g: WHO conditional free-sugar recommendation (< 5 % of energy);
  #   https://www.who.int/publications/i/item/9789241549028
  # salt 5 g: WHO sodium guideline (< 2 g sodium a day);
  #   https://www.who.int/publications/i/item/9789241504836
  # protein 0.83 g/kg: WHO/FAO/UNU safe level for adults (TRS 935, 2007); a TARGET, not a limit.
  #   https://www.who.int/publications/i/item/9789241209359
  adult:  {sugar_g: 25, salt_g: 5, protein_g_per_kg: 0.83}
  # key = min age of band, for infant.max_age <= age < child.max_age. Child SUGAR reuses
  # conditions.child.free_sugar_daily_limit_g. NHS: 1-3 y 2 g, 4-6 y 3 g, 7-10 y 5 g, 11+ 6 g
  # (Ruling P6-R1: 2-3 year olds keep NHS's own 2 g, the stricter value).
  #   https://www.nhs.uk/live-well/eat-well/food-types/salt-nutrition/
  child_salt_g_by_min_age: {2: 2, 4: 3, 7: 5, 11: 6}
  # Under 2 (conditions.infant.max_age): no added sugar or salt (WHO). 0 means any logged
  # sugar or salt shows as "over" (total sugars include milk lactose, so this over-warns).
  infant: {sugar_g: 0, salt_g: 0}
  # "near" from this share of the limit (SmartNutri working value).
  near_pct: 80
# Sources shown on "How we score" (methodology(); Plan 5 T2). Read only by methodology(),
# never by the rules. url_verified: false until a human has opened and checked each URL
# (Ruling P5-R10); the public M5 page must not ship unverified links.
sources:
  nutriscore_2023: {title: "Nutri-Score 2023 update (Santé publique France)", url: "https://www.santepubliquefrance.fr/nutri-score-2023-update", url_verified: false}
  uk_fsa_front_of_pack: {title: "UK FSA front-of-pack guidance (high thresholds)", url: "https://www.food.gov.uk/safety-hygiene/check-the-label", url_verified: false}
  fssai_claims_2018: {title: "FSSAI (Advertising & Claims) Regulations 2018", url: "https://www.fssai.gov.in/upload/uploadfiles/files/Compendium_Advertising_Claims_Regulations_14_12_2022.pdf", url_verified: false}
  fssai_labelling_2020: {title: "FSSAI Labelling & Display Regulations 2020", url: "https://www.fssai.gov.in/cms/food-safety-and-standards-regulations.php", url_verified: false}
  icmr_nin_2024: {title: "ICMR-NIN Dietary Guidelines for Indians 2024", url: "https://www.nin.res.in/dietaryguidelines/", url_verified: false}
  nhs_child_sugar: {title: "NHS: sugar limits for children", url: "https://www.nhs.uk/live-well/eat-well/food-types/how-does-sugar-in-our-diet-affect-our-health/", url_verified: false}
  who_infant: {title: "WHO guidance: no added sugar or salt under 2", url: "https://www.who.int/news-room/fact-sheets/detail/healthy-diet", url_verified: false}
  uk_sdil: {title: "UK Soft Drinks Industry Levy (5 g sugar per 100 ml)", url: "https://www.gov.uk/guidance/soft-drinks-industry-levy", url_verified: false}
  ada_standards_of_care: {title: "American Diabetes Association: Standards of Care in Diabetes, Section 5", url: "https://diabetesjournals.org/care/issue/48/Supplement_1", url_verified: false}
  who_free_sugars: {title: "WHO guideline: sugars intake for adults and children", url: "https://www.who.int/publications/i/item/9789241549028", url_verified: false}
  who_sodium: {title: "WHO guideline: sodium intake for adults and children", url: "https://www.who.int/publications/i/item/9789241504836", url_verified: false}
  who_protein_2007: {title: "WHO/FAO/UNU: protein and amino acid requirements in human nutrition (2007)", url: "https://www.who.int/publications/i/item/9789241209359", url_verified: false}
  nhs_child_salt: {title: "NHS: salt limits for children", url: "https://www.nhs.uk/live-well/eat-well/food-types/salt-nutrition/", url_verified: false}
  # Numbers SmartNutri chose itself (no external source states them). No link.
  smartnutri_working_values: {title: "SmartNutri working values, pending clinician review", url: null, url_verified: false}
# Section -> where its numbers come from (`thresholds`) and, optionally, why the rule exists
# (`rationale`). Both are lists of keys from `sources` above. null = a member's own preference,
# not a health rule, so there is nothing to cite (Ruling P7).
section_sources:
  nutriscore_2023: {thresholds: [nutriscore_2023]}
  high_in:         {thresholds: [uk_fsa_front_of_pack]}
  allergens:       {thresholds: [fssai_labelling_2020]}
  diet:            {thresholds: [fssai_labelling_2020]}
  claims:          {thresholds: [fssai_claims_2018]}
  # avoid/caution sugars: UK FSA high-in and FSSAI low-sugar bands; drink avoid: UK SDIL;
  # carbs per serving (30 g): SmartNutri. ICMR-NIN and ADA are attached below as rationale
  # only (not threshold sources); they back the cardio_high_in rule. ICMR-NIN is likewise
  # rationale-only for hypertension and weight_loss.
  blood_sugar:     {thresholds: [uk_fsa_front_of_pack, fssai_claims_2018, uk_sdil, smartnutri_working_values], rationale: [icmr_nin_2024, ada_standards_of_care]}
  # avoid 1.5 g and caution 0.3 g salt per 100 g are the UK FSA high and low salt bands.
  hypertension:    {thresholds: [uk_fsa_front_of_pack], rationale: [icmr_nin_2024]}
  # 400 kcal and the protein density are SmartNutri values; D/E are Nutri-Score grades.
  weight_loss:     {thresholds: [smartnutri_working_values, nutriscore_2023], rationale: [icmr_nin_2024]}
  # Daily free-sugar limits by age are NHS; the 25 % / 50 % shares are SmartNutri values.
  child:           {thresholds: [nhs_child_sugar, smartnutri_working_values]}
  # 5 g sugar and 0.3 g salt per 100 g are SmartNutri values (Ruling R27), NOT WHO numbers.
  infant:          {thresholds: [smartnutri_working_values], rationale: [who_infant]}
  custom_alerts:   null
  # Adult sugar and salt: WHO; protein target: WHO/FAO/UNU; child bands: NHS; the 80 % "near"
  # share: SmartNutri. Infant 0 g rests on WHO's "no added sugar or salt under 2" (rationale).
  daily_limits:    {thresholds: [who_free_sugars, who_sodium, who_protein_2007, nhs_child_sugar, nhs_child_salt, smartnutri_working_values], rationale: [who_infant]}
