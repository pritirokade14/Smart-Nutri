[project]
name = "smartnutri-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.120",
    "httpx>=0.28",
    "openai>=3.42.1",
    "pillow>=13.0.0",
    "posthog>=7.82.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.2",
    "sentry-sdk>=2.20",
    "sqlalchemy[asyncio]>=2.0.40",
    "standardwebhooks>=1.1.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
