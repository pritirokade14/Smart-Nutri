name: smartnutri_ai
description: "SmartNutri AI Android app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.9.0
  smartnutri_api:
    path: ../../packages/api-contract/dart
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.0.0
  sentry_flutter: ^9.0.0
  posthog_flutter: ^5.0.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.0
  image_picker: ^1.2.4
  image: ^4.12.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # SIL Open Font License 1.1 for Mukta; registered with LicenseRegistry.
    - assets/fonts/mukta/OFL.txt
  fonts:
    # Mukta (Ek Type) covers Latin and Devanagari, so English, Hindi and
    # Marathi share one family and one set of metrics.
    - family: Mukta
      fonts:
        - asset: assets/fonts/mukta/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/mukta/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/mukta/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mukta/Mukta-Bold.ttf
          weight: 700
