name: smartnutri_ai
description: "SmartNutri AI Android app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.9.0
  smartnutri_api:
    path: ../../packages/api-contract/dart
